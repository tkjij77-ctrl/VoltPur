name: ⚡ Build VoltPur

on:
  push:
    branches: [ ver/26.2, voltcore-phase1 ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 🔍 Checkout VoltPur
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: ☕ Setup Java 25
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: 🔧 Configure Git
        run: |
          git config --global user.email "voltpur@builder.dev"
          git config --global user.name "VoltPur Builder"

      # The patch/decompile pipeline is occasionally non-deterministic: the same
      # commit can fail one run and pass the next (observed on 40474803: run #69
      # failed once, run #70 passed with identical sources). Treat both steps as
      # retry-once, with a clean re-apply of the generated sources in between.
      # NOTE: this only changes what happens AFTER a failure - on success the same
      # commands run in the same order as before.
      - name: 📦 Apply Patches
        run: |
          chmod +x gradlew
          if ./gradlew applyAllPatches --stacktrace; then exit 0; fi
          echo "::warning title=Flaky patch pipeline::applyAllPatches failed - cleaning generated sources and retrying once"
          rm -rf purpur-server/src/minecraft
          ./gradlew applyAllPatches --stacktrace

      - name: 🏗️ Build Paperclip JAR
        run: |
          if ./gradlew :purpur-server:createPaperclipJar --stacktrace; then exit 0; fi
          echo "::warning title=Flaky build pipeline::build failed - re-applying patches cleanly and retrying once"
          rm -rf purpur-server/src/minecraft purpur-server/build
          ./gradlew applyAllPatches --stacktrace
          ./gradlew :purpur-server:createPaperclipJar --stacktrace

      - name: 📝 Prepare Artifacts
        run: |
          cd purpur-server/build/libs
          ls -lh
          PAPERCLIP_JAR=$(ls -1 *mojmap*paperclip*.jar 2>/dev/null | head -n 1)
          if [ -z "$PAPERCLIP_JAR" ]; then
            PAPERCLIP_JAR=$(ls -1 *paperclip*.jar 2>/dev/null | head -n 1)
          fi
          echo "Found jar: $PAPERCLIP_JAR"
          cp "$PAPERCLIP_JAR" VoltPur-26.2.jar
          cp "$PAPERCLIP_JAR" VoltPur.jar
          cp "$PAPERCLIP_JAR" server.jar
          sha256sum VoltPur-26.2.jar > VoltPur-26.2.jar.sha256
          ls -lh VoltPur*.jar server.jar
          file VoltPur-26.2.jar

      - name: 📤 Upload JAR
        uses: actions/upload-artifact@v7
        with:
          name: VoltPur-26.2-Paperclip
          path: |
            purpur-server/build/libs/VoltPur-26.2.jar
            purpur-server/build/libs/VoltPur.jar
            purpur-server/build/libs/server.jar
            purpur-server/build/libs/VoltPur-26.2.jar.sha256
            purpur-server/build/libs/*-paperclip.jar

      # A jar that builds is not a jar that boots. The four honesty fixes (MC version,
      # container RAM, cgroup source, single benchmark print) were all runtime behaviour
      # that only showed up on a real server - never in CI. This step boots the built jar
      # on JDK 25 and fails the job if the live console output regresses.
      - name: 🧪 Smoke test - boot the built jar and check the live console
        run: |
          set -uo pipefail
          SMOKE="$GITHUB_WORKSPACE/.smoke"
          rm -rf "$SMOKE"; mkdir -p "$SMOKE"; cd "$SMOKE"
          echo "eula=true" > eula.txt
          cat > server.properties <<'PROPS'
          level-name=smoke
          level-type=minecraft\:flat
          view-distance=3
          simulation-distance=3
          online-mode=false
          server-port=25599
          PROPS
          ( cd "$GITHUB_WORKSPACE/purpur-server/build/libs" && sha256sum -c VoltPur-26.2.jar.sha256 )
          cp "$GITHUB_WORKSPACE/purpur-server/build/libs/VoltPur-26.2.jar" server.jar
          # Paperclip applies its patches and then relaunches the real server as a CHILD
          # process, so "the PID we started" is not reliably the server. Watch the log for
          # evidence instead of watching one PID, and stop the server by command line.
          java -Xms256M -Xmx512M -jar server.jar --nogui > smoke.log 2>&1 &
          BOOTED=0
          for i in $(seq 1 125); do
            if grep -q 'Done (' smoke.log 2>/dev/null; then BOOTED=1; break; fi
            sleep 2
          done
          pkill -f -- '-jar server.jar' 2>/dev/null || true
          sleep 3
          pkill -9 -f -- '-jar server.jar' 2>/dev/null || true
          echo "----- smoke.log (last 45 lines) -----"
          tail -n 45 smoke.log
          echo "-------------------------------------"
          SHORT=$(printf '%s' "$GITHUB_SHA" | cut -c1-7)
          FAIL=0
          check() { if grep -qE "$2" smoke.log; then echo "  PASS  $1"; else echo "  FAIL  $1"; FAIL=1; fi; }
          if [ "$BOOTED" = "1" ]; then echo "  PASS  the server booted (Done) within the timeout"; else echo "  FAIL  the server never printed 'Done ('"; FAIL=1; fi
          check "the build stamp matches this commit (@$SHORT)" "@$SHORT"
          check "version string is the real one" "Starting minecraft server version 26\.2"
          check "hardware report ran" "VoltPur hardware report"
          # The heap line has three legitimate wordings (OK / TOO HIGH / conservative) and
          # all of them must name a concrete -Xmx recommendation. The first version of this
          # check matched only the "upper suggestion:" wording and failed a healthy build
          # on a runner where the verdict was "conservative" - the gate was right to fail.
          check "the heap line recommends a concrete -Xmx" "Heap +: .*-Xmx[0-9]+M"
          check "safety defaults are stated at startup" "Safety: item-limiter=off"
          check "updater is advertised at startup" "verified, reversible updates"
          if grep -qE "MB host|yes \(none\)|source: none|1\.21\.10" smoke.log; then
            echo "  FAIL  strings from the fixed defects are back in the live output:"
            grep -nE "MB host|yes \(none\)|source: none|1\.21\.10" smoke.log | head -5
            FAIL=1
          else
            echo "  PASS  no old defect strings ('MB host' / 'yes (none)' / 'source: none' / '1.21.10')"
          fi
          exit $FAIL

      - name: 📎 Upload smoke-test log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-log-${{ github.run_number }}
          path: .smoke/smoke.log
          if-no-files-found: warn

      - name: 🚀 Create Release (public download for /vo up without token)
        if: success() && github.ref == 'refs/heads/ver/26.2'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}-${{ github.sha }}
          name: VoltPur Build ${{ github.run_number }}
          body: |
            VoltPur 26.2 - Build ${{ github.run_number }}
            Commit: ${{ github.sha }}

            ### Download (no token needed):
            - VoltPur-26.2.jar  (+ .sha256 checksum - the in-game updater verifies it)
            - server.jar (for Pterodactyl panels)

            ### Install (verified + reversible):
            /vo up list            -> recent builds (cached on disk)
            /vo up <number>        -> download + SHA-256 verification + shows the plan
            /vo up confirm         -> applies it (keeps plugins, configs, worlds, backups)
            /vo rollback           -> restores the previous server jar if needed

            ### What this build actually does (no performance claims):
            - /voltpur modules   -> implementation status + LIVE health per module (runs/fails)
            - /voltpur benchmark -> measured TPS / MSPT / entities / chunks / heap / hoppers
            - /voltpur hardware  -> real CPU/RAM (container-quota aware) + JVM flags for THIS machine
            - Updater            -> checksum-verified, non-destructive, two-phase, rollback support
            - Safety defaults    -> item limiter OFF, dynamic optimizer OFF, PAdmin OFF, clean reinstall OFF
            - No NMS performance patches are included. See POLICY.md and docs/BENCHMARKS.md.
          files: |
            purpur-server/build/libs/VoltPur-26.2.jar
            purpur-server/build/libs/VoltPur.jar
            purpur-server/build/libs/server.jar
            purpur-server/build/libs/VoltPur-26.2.jar.sha256
          token: ${{ secrets.GITHUB_TOKEN }}
