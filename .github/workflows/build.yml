name: ⚡ Build VoltPur

on:
  push:
    branches: [ ver/26.2 ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version'
        required: false
        default: '26.2-build-1'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: 🔍 Checkout VoltPur (OWN REPO)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: 🔧 Configure Git
        run: |
          git config --global user.email "voltpur@builder.dev"
          git config --global user.name "VoltPur Builder"

      - name: 📦 Apply Patches
        run: |
          chmod +x gradlew
          ./gradlew applyAllPatches --stacktrace

      - name: 🏗️ Build Paperclip JAR
        run: |
          ./gradlew createMojmapPaperclipJar --stacktrace

      - name: 📤 Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: VoltPur-26.2-Paperclip
          path: |
            purpur-server/build/libs/*-paperclip.jar
            purpur-server/build/libs/*-mojmap-paperclip.jar
