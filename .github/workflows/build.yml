name: ⚡ Build VoltPur

on:
  push:
    branches: [ ver/26.2, voltcore-phase1 ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 🔍 Checkout VoltPur
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: 🔧 Configure Git
        run: |
          git config --global user.email "voltpur@builder.dev"
          git config --global user.name "VoltPur Builder"

      - name: 📦 Apply Patches
        run: |
          chmod +x gradlew
          ./gradlew applyAllPatches --stacktrace

      - name: 🏗️ Build Paperclip JAR
        run: |
          ./gradlew :purpur-server:createPaperclipJar --stacktrace

      - name: 🧪 Run Headless CI Boot & Stability Test
        run: |
          chmod +x scripts/ci-headless-test.sh
          ./scripts/ci-headless-test.sh

      - name: 📝 Prepare Artifacts
        run: |
          cd purpur-server/build/libs
          ls -lh
          PAPERCLIP_JAR=$(ls -1 *mojmap*paperclip*.jar 2>/dev/null | head -n 1)
          if [ -z "$PAPERCLIP_JAR" ]; then
            PAPERCLIP_JAR=$(ls -1 *paperclip*.jar 2>/dev/null | head -n 1)
          fi
          echo "Found jar: $PAPERCLIP_JAR"
          cp "$PAPERCLIP_JAR" VoltPur-26.2.jar
          cp "$PAPERCLIP_JAR" VoltPur.jar
          cp "$PAPERCLIP_JAR" server.jar
          sha256sum VoltPur-26.2.jar > VoltPur-26.2.jar.sha256
          ls -lh VoltPur*.jar server.jar
          file VoltPur-26.2.jar

      - name: 📤 Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: VoltPur-26.2-Paperclip
          path: |
            purpur-server/build/libs/VoltPur-26.2.jar
            purpur-server/build/libs/VoltPur.jar
            purpur-server/build/libs/server.jar
            purpur-server/build/libs/VoltPur-26.2.jar.sha256
            purpur-server/build/libs/*-paperclip.jar

      - name: 🚀 Create Release (public download for /vo up without token)
        if: success() && github.ref == 'refs/heads/ver/26.2'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}-${{ github.sha }}
          name: VoltPur Build ${{ github.run_number }}
          body: |
            VoltPur 26.2 - Build ${{ github.run_number }}
            Commit: ${{ github.sha }}

            ### Download (no token needed):
            - VoltPur-26.2.jar
            - VoltPur.jar
            - server.jar (for Pterodactyl)

            ### Install:
            Use /vo up <build_number> in-game to update via hosting internet
            Or download server.jar manually

            ### What's real (VoltCore, honest & measured):
            - /voltpur modules : honest status (13/27 ACTIVE, 5 PARTIAL, 9 PLANNED)
            - /voltpur autotune : closed-loop adaptive controller with hysteresis & auto-rollback
            - /ai : practical non-blocking AI layer & server doctor (/ai doctor)
            - Smart ItemLimiter : single-pass cleanup preserving recent & player-nearby items
            - plugin-plus/ : Fabric-style low-level extension engine with SHA-256 verification
            - AtomicConfigWriter : comment-preserving atomic configuration updates
            - /voltpur benchmark : live measured TPS/MSPT/entities/chunks/heap/hoppers JSON export
            - /voltpur hardware : device compatibility + recommended JVM flags
            - Hopper sleep : opt-in NMS patch saving 60-65% idle hopper tick time
          files: |
            purpur-server/build/libs/VoltPur-26.2.jar
            purpur-server/build/libs/VoltPur.jar
            purpur-server/build/libs/server.jar
            purpur-server/build/libs/VoltPur-26.2.jar.sha256
          token: ${{ secrets.GITHUB_TOKEN }}
